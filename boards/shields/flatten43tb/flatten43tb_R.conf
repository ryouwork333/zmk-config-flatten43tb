CONFIG_ZMK_KEYBOARD_NAME="flatten43tb"

CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_BLE=y
CONFIG_SPI=y
CONFIG_INPUT=y

# Split (R side = peripheral)
CONFIG_ZMK_SPLIT=y

# Pointing / Mouse
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

# PMW3610 Trackball
CONFIG_PMW3610=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20

# Rotary Encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y
