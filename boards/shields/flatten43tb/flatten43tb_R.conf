# Flatten43tb Right Shield Configuration

CONFIG_ZMK_KEYBOARD_NAME="Flatten43tb"

# NFC pins as GPIOs
CONFIG_NFCT_PINS_AS_GPIOS=y

# Split configuration (Right side is CENTRAL)
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Pointing / Mouse
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

# PMW3610 Trackball
CONFIG_PMW3610=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=256
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20

# Rotary Encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y

# RGB Widget 無効（aliasエラー回避）
CONFIG_ZMK_RGBLED_WIDGET=n
