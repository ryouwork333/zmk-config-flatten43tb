# Flatten43tb Left Shield Configuration

# NFC pins as GPIOs
CONFIG_NFCT_PINS_AS_GPIOS=y

# EC11 rotary encoder support
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y

# Pointing support
CONFIG_ZMK_POINTING=y

# RGB LED Widget disabled
CONFIG_RGBLED_WIDGET=n
