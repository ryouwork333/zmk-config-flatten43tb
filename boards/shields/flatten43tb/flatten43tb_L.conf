# Flatten43tb Left Shield Configuration

# NFC pins as GPIOs
CONFIG_NFCT_PINS_AS_GPIOS=y

# EC11 rotary encoder support
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y

# Split configuration (Left side is PERIPHERAL)
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_PERIPHERAL=y

# Pointing support
CONFIG_ZMK_POINTING=y

# RGB LED Widget 無効化（aliasエラー対策）
CONFIG_ZMK_RGBLED_WIDGET=n
