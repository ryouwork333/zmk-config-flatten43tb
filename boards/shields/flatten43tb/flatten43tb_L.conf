# Flatten43tb Left Shield configuration

# NFC pins used as GPIOs
CONFIG_NFCT_PINS_AS_GPIOS=y

# EC11 rotary encoder support
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Battery reporting (optional, does not affect RGB widget)
CONFIG_ZMK_BATTERY_REPORTING=y

# BLE split central configuration (may warn but not fatal)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Pointing device support
CONFIG_ZMK_POINTING=y

# Note:
# RGBLED_WIDGET and related settings have been removed
# to avoid devicetree alias requirement errors
